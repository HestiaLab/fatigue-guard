name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore FatigueGuard.sln

      - name: Build
        run: dotnet build FatigueGuard.sln -c Release --no-restore

      - name: Format check
        run: dotnet format FatigueGuard.sln --verify-no-changes --no-restore

      - name: Test
        run: dotnet test FatigueGuard.sln -c Release --no-build --logger "console;verbosity=normal"

  installer:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build MSI
        run: pwsh -NoProfile -File scripts/build-installer.ps1
